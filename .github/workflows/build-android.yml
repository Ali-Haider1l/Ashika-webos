name: Build Ashika Live TV Android APK
on:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'stream-refresh.js'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare web app assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js style.css android/app/src/main/assets/
          if [ -f stream-refresh.js ]; then cp stream-refresh.js android/app/src/main/assets/; fi
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-android-v1.0.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
