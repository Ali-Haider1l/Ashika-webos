name: Build Ashika Live TV IPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build webOS IPK
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-v2.0.0-ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
