name: Build Ashika Live TV IPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build webOS IPK
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils python3
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate IPK package structure
        run: |
          set -e
          PKG="$(find dist -name '*.ipk' -type f | head -n 1)"
          test -n "$PKG"
          ar t "$PKG" | grep -qx 'debian-binary'
          ar t "$PKG" | grep -qx 'control.tar.gz'
          ar t "$PKG" | grep -qx 'data.tar.gz'
          echo "Validated $PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-v4.0.0-ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
