name: Build Ashika Live TV IPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
      - name: Check source syntax
        run: |
          node --check app.js
          bash -n scripts/build-ipk.sh
          python3 -m json.tool appinfo.json >/dev/null
      - name: Build webOS-compatible IPK
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh
      - name: Validate webOS IPK archive and metadata
        run: |
          set -euo pipefail
          PKG="$(find dist -maxdepth 1 -name '*.ipk' -type f | head -n 1)"
          test -n "$PKG"
          python3 - "$PKG" <<'PY'
          import gzip, io, json, os, sys, tarfile
          path = sys.argv[1]
          with open(path, "rb") as f:
              blob = f.read()
          if not blob.startswith(b"!<arch>\n"):
              raise SystemExit("Invalid ar magic")
          pos = 8
          members = {}
          while pos < len(blob):
              header = blob[pos:pos+60]
              if len(header) != 60 or header[58:60] != b"`\n":
                  raise SystemExit("Invalid ar member header")
              name = header[:16].decode("ascii").strip()
              if name.endswith("/"):
                  raise SystemExit("ar member names must be bare (no trailing slash)")
              size = int(header[48:58].decode("ascii").strip())
              pos += 60
              members[name] = blob[pos:pos+size]
              pos += size + (size % 2)
          if list(members) != ["debian-binary", "control.tar.gz", "data.tar.gz"]:
              raise SystemExit("Unexpected IPK members: " + repr(list(members)))
          if members["debian-binary"] != b"2.0\n":
              raise SystemExit("Invalid debian-binary marker")
          def read_tar(member):
              return tarfile.open(fileobj=io.BytesIO(gzip.decompress(members[member])), mode="r:")
          with read_tar("control.tar.gz") as tf:
              control = tf.extractfile("control").read().decode()
          fields = dict(line.split(": ", 1) for line in control.splitlines() if ": " in line)
          with read_tar("data.tar.gz") as tf:
              names = set(tf.getnames())
              required = [
                  "usr/palm/applications/com.ashika.livetv.webos/appinfo.json",
                  "usr/palm/applications/com.ashika.livetv.webos/index.html",
                  "usr/palm/applications/com.ashika.livetv.webos/app.js",
                  "usr/palm/applications/com.ashika.livetv.webos/style.css",
                  "usr/palm/packages/com.ashika.livetv.webos/packageinfo.json",
              ]
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("Missing package files: " + repr(missing))
              appinfo = json.load(tf.extractfile(required[0]))
              packageinfo = json.load(tf.extractfile(required[-1]))
          version = appinfo["version"]
          if fields.get("Version") != version or packageinfo.get("version") != version:
              raise SystemExit("Version mismatch between control, appinfo and packageinfo")
          if packageinfo.get("package_format_version") != 2:
              raise SystemExit("Invalid package format version")
          print(f"Validated {path}: version {version}, bare ar headers, app and package metadata present")
          PY
          BYTES="$(wc -c < "$PKG" | tr -d ' ')"
          echo "IPK size: $BYTES bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-v6.3.0-ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
