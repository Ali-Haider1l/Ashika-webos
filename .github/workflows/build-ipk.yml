name: Build Ashika Live TV IPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils python3
      - name: Check source syntax
        run: |
          node --check app.js
          bash -n scripts/build-ipk.sh
          python3 -m json.tool appinfo.json >/dev/null
      - name: Build optimized webOS IPK
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh
      - name: Validate IPK structure, contents and size
        run: |
          set -euo pipefail
          PKG="$(find dist -name '*.ipk' -type f | head -n 1)"
          test -n "$PKG"
          ar t "$PKG" | grep -qx 'debian-binary'
          ar t "$PKG" | grep -qx 'control.tar.gz'
          ar t "$PKG" | grep -qx 'data.tar.gz'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          (cd "$TMP" && ar x "$GITHUB_WORKSPACE/$PKG")
          tar -tzf "$TMP/data.tar.gz" | grep -q '/app.js$'
          tar -tzf "$TMP/data.tar.gz" | grep -q '/index.html$'
          tar -tzf "$TMP/data.tar.gz" | grep -q '/style.css$'
          BYTES="$(wc -c < "$PKG" | tr -d ' ')"
          echo "Validated $PKG ($BYTES bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-v6.3.0-ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
